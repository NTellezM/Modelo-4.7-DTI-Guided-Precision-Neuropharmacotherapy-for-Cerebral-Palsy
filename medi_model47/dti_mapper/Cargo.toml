[package]
name = "dti_mapper"
version = "0.1.0"
edition = "2021"
authors = ["Model 4.7 Pipeline Team"]
description = "Log-Euclidean DTI tensor interpolation onto FEM meshes"
license = "MIT"
readme = "README.md"
keywords = ["dti", "tensor", "interpolation", "fem", "diffusion"]

[lib]
name = "dti_mapper"
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
rayon = "1.10"
numpy = "0.22"
pyo3 = { version = "0.22", features = ["extension-module"] }
thiserror = "2.0"
log = "0.4"
pyo3-log = "0.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
rand_distr = "0.4"
approx = "0.5"

[[bench]]
name = "interpolation_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
