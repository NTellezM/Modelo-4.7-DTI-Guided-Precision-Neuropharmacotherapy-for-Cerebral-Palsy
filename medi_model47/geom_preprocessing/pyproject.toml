[project]
name = "geom_preprocessing"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "nibabel>=5.0", "meshio>=5.3", "scipy>=1.11", "scikit-image>=0.21"]

[project.optional-dependencies]
gmsh = ["gmsh>=4.12"]
dev = ["pytest>=7.4"]

[project.scripts]
geom-preproc = "geom_preprocessing.cli:main"
